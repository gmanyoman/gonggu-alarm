<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="또미제리 공구" />
<title>또미제리 살림 공구 알리미</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --text: #191919; --sub: #8b8b8b; --line: #ececec; --chip: #f2f2f2;
    --live: #e5484d;  --live-bg: #fff4f4;
    --soon: #1f9d63;  --soon-bg: #effaf4;
    --guess: #d08700; --guess-bg: #fff8e8;
    --etc: #8b8b8b;   --etc-bg: #f6f6f6;
    --manual: #4f6bed; --manual-bg: #f2f5ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1d1d1d; --text: #f2f2f2; --sub: #9a9a9a; --line: #2c2c2c; --chip: #2a2a2a;
      --live: #ff6b6f;  --live-bg: #2a1718;
      --soon: #45c98a;  --soon-bg: #142a1f;
      --guess: #f0b13e; --guess-bg: #2c2412;
      --etc: #9a9a9a;   --etc-bg: #1a1a1a;
      --manual: #8ea1ff; --manual-bg: #191d2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.5px; }
  .icon-btn {
    border: 0; background: var(--chip); color: var(--text); width: 40px; height: 40px;
    border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  .icon-btn.spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { position: relative; margin-bottom: 12px; }
  .search input {
    width: 100%; font-size: 16px; padding: 14px 16px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--chip); color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--text); background: var(--card); }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.10); max-height: 320px; overflow: auto; display: none;
  }
  .suggest button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 12px 16px; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .suggest button:last-child { border-bottom: 0; }
  .suggest button:hover, .suggest button:focus { background: var(--chip); outline: none; }
  .suggest button.add-manual { font-weight: 700; }
  .suggest .hint { padding: 12px 16px; font-size: 13px; color: var(--sub); }

  /* 묶음(섹션): 묶음마다 옅은 배경색 + 색 있는 제목, 안쪽 카드는 무채색 */
  .grp { border-radius: 18px; padding: 12px 10px 4px; margin-top: 14px; background: var(--gbg); }
  .grp-title {
    display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;
    color: var(--gc); margin: 2px 6px 10px;
  }
  .grp-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
  .grp-title .cnt { font-weight: 600; opacity: .8; }
  .g-live   { --gc: var(--live);   --gbg: var(--live-bg); }
  .g-soon   { --gc: var(--soon);   --gbg: var(--soon-bg); }
  .g-guess  { --gc: var(--guess);  --gbg: var(--guess-bg); }
  .rest { margin-top: 18px; }
  .rest summary {
    list-style: none; cursor: pointer; font-size: 13px; color: var(--sub); padding: 6px 4px; font-weight: 600;
  }
  .rest summary::-webkit-details-marker { display: none; }
  .rest summary::after { content: ' ▾'; }
  .rest[open] summary::after { content: ' ▴'; }
  .rest .card { border: 1px solid var(--line); box-shadow: none; }

  .card {
    background: var(--card); border-radius: 14px; padding: 13px 14px; margin-bottom: 8px;
    box-shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  .card-top { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; }
  .card-main { flex: 1; min-width: 0; }
  .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .name { font-size: 16px; font-weight: 700; min-width: 0; }
  .when { font-size: 15px; font-weight: 800; flex-shrink: 0; }
  .badge { font-size: 12px; color: var(--sub); margin-top: 3px; }
  .detail { font-size: 13px; color: var(--sub); margin-top: 4px; line-height: 1.5; }
  .detail a, .more { color: var(--text); text-decoration: underline; text-underline-offset: 2px; font-weight: 600; }
  .remove {
    border: 0; background: none; color: var(--sub); font-size: 18px; cursor: pointer; padding: 0 2px; line-height: 1;
  }
  .history { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; display: none; }
  .card.open .history { display: block; }
  .hrow { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 4px 0; }
  .hrow span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hrow span:last-child { color: var(--sub); flex-shrink: 0; }
  .more { display: inline-block; margin-top: 8px; font-size: 13px; }
  .empty { text-align: center; color: var(--sub); padding: 48px 12px; line-height: 1.7; font-size: 14px; }
  .err { color: var(--live); }
  .share {
    display: flex; align-items: center; justify-content: flex-end; gap: 8px; font-size: 12px; color: var(--sub);
    padding: 0 0 2px;
  }
  .share .txt { flex: 1; min-width: 0; line-height: 1.4; }
  .share .txt b { color: var(--text); font-weight: 600; }
  .share .txt a { color: var(--sub); }
  .share button {
    border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font-size: 12px; font-weight: 700; cursor: pointer;
    background: var(--card); color: var(--text); flex-shrink: 0;
  }
  .share.warn .txt b { color: var(--guess); }
  /* 자주 가는 곳 (맨 위, 접었다 폈다) */
  .links { background: var(--chip); border-radius: 14px; margin-bottom: 12px; }
  .links summary {
    list-style: none; cursor: pointer; padding: 12px 14px; font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: space-between;
  }
  .links summary::-webkit-details-marker { display: none; }
  .links summary::after { content: '▾'; color: var(--sub); font-size: 12px; }
  .links[open] summary::after { content: '▴'; }
  .links summary .cnt { color: var(--sub); font-weight: 600; margin-left: 4px; }
  .links-body { padding: 0 14px 12px; }
  .link-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
  .link-row a { flex: 1; min-width: 0; color: var(--text); font-size: 14px; font-weight: 600; text-decoration: none;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .link-row a::after { content: ' →'; color: var(--sub); }
  .link-form { display: flex; gap: 6px; margin-top: 8px; }
  .link-form input {
    min-width: 0; font-size: 14px; padding: 9px 10px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--text); outline: none;
  }
  .link-form input[name=name] { flex: 0 0 38%; }
  .link-form input[name=url] { flex: 1; }
  .link-form button {
    border: 0; border-radius: 10px; padding: 0 12px; font-size: 14px; font-weight: 700;
    background: var(--text); color: var(--bg); cursor: pointer; flex-shrink: 0;
  }
  .links .none { font-size: 13px; color: var(--sub); padding: 4px 0 2px; }
  footer { text-align: center; font-size: 11px; color: var(--sub); margin-top: 24px; line-height: 1.6; }
  footer a { color: var(--sub); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>또미제리 살림 공구 알리미</h1>
    <button class="icon-btn" id="refresh" title="새로고침">↻</button>
  </header>

  <details class="links" id="links">
    <summary><span>🔖 자주 가는 곳<span class="cnt" id="linkCnt"></span></span></summary>
    <div class="links-body">
      <div id="linkList"></div>
      <form class="link-form" id="linkForm">
        <input name="name" placeholder="이름 (예: 차앤맘)" autocomplete="off" />
        <input name="url" type="url" inputmode="url" placeholder="링크 붙여넣기" autocomplete="off" required />
        <button type="submit">추가</button>
      </form>
    </div>
  </details>

  <div class="search">
    <input id="q" type="search" placeholder="자주 사는 물건 검색 (예: 주니 빨대컵)" autocomplete="off" />
    <div class="suggest" id="suggest"></div>
  </div>

  <div class="share" id="share"></div>

  <div id="list"></div>

  <footer>일정 출처: <a href="https://momcalendar.com" target="_blank" rel="noopener">맘캘린더</a></footer>
</div>

<script src="/app.js"></script>
</body>
</html>
