<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="또미제리 공구" />
<title>또미제리 살림 공구 알리미</title>
<style>
  :root {
    --bg: #ffffff; --card: #ffffff; --text: #191919; --sub: #8b8b8b; --line: #ececec; --chip: #f2f2f2;
    --live: #e5484d;  --live-bg: #fff4f4;
    --soon: #1f9d63;  --soon-bg: #effaf4;
    --guess: #d08700; --guess-bg: #fff8e8;
    --etc: #8b8b8b;   --etc-bg: #f6f6f6;
    --manual: #4f6bed; --manual-bg: #f2f5ff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212; --card: #1d1d1d; --text: #f2f2f2; --sub: #9a9a9a; --line: #2c2c2c; --chip: #2a2a2a;
      --live: #ff6b6f;  --live-bg: #2a1718;
      --soon: #45c98a;  --soon-bg: #142a1f;
      --guess: #f0b13e; --guess-bg: #2c2412;
      --etc: #9a9a9a;   --etc-bg: #1a1a1a;
      --manual: #8ea1ff; --manual-bg: #191d2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 120px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 0 14px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.5px; }
  .icon-btn {
    border: 0; background: var(--chip); color: var(--text); width: 40px; height: 40px;
    border-radius: 12px; font-size: 18px; cursor: pointer;
  }
  .icon-btn.spin { animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .search { position: relative; margin-bottom: 12px; }
  .search input {
    width: 100%; font-size: 16px; padding: 14px 16px; border-radius: 14px;
    border: 1.5px solid var(--line); background: var(--chip); color: var(--text); outline: none;
  }
  .search input:focus { border-color: var(--text); background: var(--card); }
  .suggest {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 10;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,.10); max-height: 320px; overflow: auto; display: none;
  }
  .suggest button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--text);
    padding: 12px 16px; font-size: 15px; cursor: pointer; border-bottom: 1px solid var(--line);
  }
  .suggest button:last-child { border-bottom: 0; }
  .suggest button:hover, .suggest button:focus { background: var(--chip); outline: none; }
  .suggest button.add-manual { font-weight: 700; }
  .suggest .hint { padding: 12px 16px; font-size: 13px; color: var(--sub); }

  /* 묶음(섹션): 묶음마다 옅은 배경색 + 색 있는 제목, 안쪽 카드는 무채색 */
  .grp { border-radius: 18px; padding: 12px 10px 4px; margin-top: 14px; background: var(--gbg); }
  .grp-title {
    display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 800;
    color: var(--gc); margin: 2px 6px 10px;
  }
  .grp-title .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gc); }
  .grp-title .cnt { font-weight: 600; opacity: .8; }
